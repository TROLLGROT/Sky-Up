name: Build APK
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Sky-Up-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish APK to Releases (main only)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Sky-Up-debug.apk
          gh release delete latest --cleanup-tag -y || true
          gh release create latest Sky-Up-debug.apk --title "Latest test build" --notes "Built from ${{ github.sha }}" --prerelease
