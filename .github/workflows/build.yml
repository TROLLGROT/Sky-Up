name: Build Android APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare APK and checksum
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Sky-Up-debug.apk
          cd dist
          sha256sum Sky-Up-debug.apk > SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: Sky-Up-debug-apk
          path: |
            dist/Sky-Up-debug.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest APK on GitHub Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest \
            dist/Sky-Up-debug.apk \
            dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Sky Up – latest debug APK" \
            --notes "Automated debug build from commit $GITHUB_SHA. This APK is signed with the standard Android debug key and is intended for testing."
